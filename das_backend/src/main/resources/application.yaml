info:
  app:
    version: "@project.version@"
    
spring:
  profiles:
    active: ${STAGE:local}
  application:
    name: backend
  web:
    locale: en
    locale-resolver: fixed
  mvc:
    problemdetails:
      enabled: true
  http:
    clients:
      connect-timeout: ${HTTP_CLIENTS_CONNECT_TIMEOUT:PT5S}
      read-timeout: ${HTTP_CLIENTS_READ_TIMEOUT:PT10S}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://login.microsoftonline.com/2cda5d11-f0ac-46b3-967d-af1b2e1bd01a/discovery/v2.0/keys
          issuer-uri: https://login.microsoftonline.com/2cda5d11-f0ac-46b3-967d-af1b2e1bd01a/v2.0
      authorizationUrl: https://login.microsoftonline.com/common/oauth2/v2.0
      client:
        registration:
          azure:
            client-id: ${SFERA_OAUTH_CLIENTID}
            client-secret: ${SFERA_OAUTH_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${SFERA_OAUTH_SCOPE}
          atlas:
            client-id: ${SFERA_OAUTH_CLIENTID}
            client-secret: ${SFERA_OAUTH_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${ATLAS_OAUTH_SCOPE}
          orca:
            client-id: ${SFERA_OAUTH_CLIENTID}
            client-secret: ${SFERA_OAUTH_SECRET}
            authorization-grant-type: client_credentials
            scope:
              - ${ORCA_OAUTH_SCOPE}
        provider:
          azure:
            token-uri: https://login.microsoftonline.com/2cda5d11-f0ac-46b3-967d-af1b2e1bd01a/oauth2/v2.0/token
          atlas:
            token-uri: https://login.microsoftonline.com/2cda5d11-f0ac-46b3-967d-af1b2e1bd01a/oauth2/v2.0/token
          orca:
            token-uri: https://login.microsoftonline.com/2cda5d11-f0ac-46b3-967d-af1b2e1bd01a/oauth2/v2.0/token
  jackson:
    mapper:
      accept-case-insensitive-enums: true
    time-zone: CET
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
  flyway:
    baseline-on-migrate: true
  kafka:
    consumer:
      properties:
        schema.registry.url: ${KAFKA_SR_URL}
        json:
          value.type: ch.sbb.zis.trainformation.api.model.DailyFormationTrain
          key.type: ch.sbb.zis.trainformation.api.model.DailyFormationTrainKey
          fail.invalid.schema: true
    jaas:
      enabled: true
      login-module: org.apache.kafka.common.security.plain.PlainLoginModule
    security:
      protocol: SASL_SSL
    properties:
      sasl.mechanism: PLAIN
      connections.max.idle.ms: 340000
      basic.auth:
        credentials.source: USER_INFO
        user.info: ${KAFKA_SR_API_KEY}:${KAFKA_SR_API_SECRET}
      schema.registry.url: ${KAFKA_SR_URL}
  jpa:
    hibernate:
      ddl-auto: validate
  cloud:
    vault:
      uri: ${VAULT_URI}
      kv:
        backend: kv/DSO-BPS/driver-advisory-system
        default-context:
      authentication: KUBERNETES
      kubernetes:
        role: ${VAULT_SA_ROLE_ID}
        kubernetes-path: ${VAULT_CLUSTERNAME}
        service-account-token-file: /var/run/secrets/openbao/token
  jmx:
    enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    oauth:
      clientId: ${AUTH_SWAGGER_CLIENT_ID}
      scopes: api://${AUTH_SERVICE_NAME}/.default
      use-pkce-with-authorization-code-grant: true

auth:
  audience:
    service-name: ${AUTH_SERVICE_NAME}

endpoints:
  web:
    cors:
      allowed-origins: ${ALLOWED_ORIGINS}
formation:
  transport-paper:
    sbbi-base-url: ${TRANSPORT_PAPER_SBBI_BASE_URL}
    blsc-app-link: ${TRANSPORT_PAPER_BLSC_APP_LINK}
    orca:
      base-url: ${TRANSPORT_PAPER_ORCA_BASE_URL}
  kafka:
    bootstrap-server: ${FORMATION_KAFKA_BOOTSTRAP_SERVER}
    group-id: ${FORMATION_KAFKA_GROUP_ID}
    username: ${FORMATION_KAFKA_API_KEY}
    password: ${FORMATION_KAFKA_API_SECRET}
    topic: ${FORMATION_KAFKA_TOPIC}
  clean-up:
    cron: 0 0 3 * * ? # every day at 3
    older-than-days: 30

logging:
  # Conventions (levels, message style, keys): das_backend/CODING_STANDARDS.md
  level:
    root: INFO
    ch.sbb.das.backend: INFO
  pattern:
    # text output (local profile and tests): Spring Boot's default plus the key-value pairs and the MDC; stages use the structured block below instead
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %kvp %X%n%wEx"
  # Splunk HEC settings handed out to the DAS client (ConfigServiceImpl), not backend logging
  url: ${SPLUNK_HEC_URL}
  token: ${SPLUNK_HEC_TOKEN}

sfera:
  major-version: "4"
  version: "4.00"
  source-device: "BACKEND"
  recipient: "0085"
  broker-url: ${SFERA_BROKER_URL}
  oauth-profile: ${SFERA_BROKER_OAUTH_PROFILE}
  topic-prefix: ${SFERA_BROKER_TOPIC_PREFIX}

preload:
  bucket:
    name: ${PRELOAD_BUCKET_NAME}
    url: ${PRELOAD_BUCKET_URL}
    region: ${PRELOAD_BUCKET_REGION}
    read-write:
      access-key-id: ${PRELOAD_BUCKET_READ_WRITE_ACCESS_KEY_ID}
      secret-access-key: ${PRELOAD_BUCKET_READ_WRITE_SECRET_ACCESS_KEY}
    read-only:
      access-key-id: ${PRELOAD_BUCKET_READ_ONLY_ACCESS_KEY_ID}
      secret-access-key: ${PRELOAD_BUCKET_READ_ONLY_SECRET_ACCESS_KEY}

trainjourneyplan:
  kafka:
    bootstrap-server: ${PRELOAD_KAFKA_BOOTSTRAP_SERVER}
    group-id: ${PRELOAD_KAFKA_GROUP_ID}
    username: ${PRELOAD_KAFKA_API_KEY}
    password: ${PRELOAD_KAFKA_API_SECRET}
    timetable-period-topic: ${PRELOAD_KAFKA_TIMETABLE_PERIOD_TOPIC}
    timetable-train-topic: ${PRELOAD_KAFKA_TIMETABLE_TRAIN_TOPIC}
  train-clean-up:
    days: ${PRELOAD_CLEANUP_DAYS}
    cron-expression: ${PRELOAD_CLEANUP_CRON}

trainjourneypreloader:
  fetch-cron: ${PRELOAD_FETCH_CRON}
  # must be shorter than fetch-cron interval to prevent overlapping runs
  max-preload-duration: ${PRELOAD_MAX_DURATION:PT4M}
  hours-before-departure: 4
  # a failing train waits min(base * 2^(attempts-1), max) before its next attempt; base should equal the fetch-cron interval
  retry-backoff:
    base: ${PRELOAD_RETRY_BACKOFF_BASE:PT5M}
    max: ${PRELOAD_RETRY_BACKOFF_MAX:PT1H}
  storage-clean-up:
    hours: ${PRELOAD_CLEANUP_HOURS}
  segment-profiles:
    # a segment profile no journey in the preload window referenced for this long is stale and evicted by the next compaction
    stale-after: ${PRELOAD_SP_STALE_AFTER:P30D}
    # a full segment zip whose share of stale entries is over this is rebuilt by the daily compaction with its live entries only
    rebuild-stale-share: ${PRELOAD_SP_REBUILD_STALE_SHARE:0.5}
    # the open segment zip is frozen and a new one opened once it is older than this
    open-zip-max-age: ${PRELOAD_SP_OPEN_ZIP_MAX_AGE:PT1H}
    # the daily compaction runs once the oldest frozen hourly segment zip is older than this
    pack-after: ${PRELOAD_SP_PACK_AFTER:PT24H}
    # a segment zip is full and closed once it has reached this size; the daily compaction folds every frozen zip that is not full
    zip-max-bytes: ${PRELOAD_SP_ZIP_MAX_BYTES:5MB}

proxy:
  base-url: ${PROXY_BASE_URL}
  basic-auth: ${PROXY_BASIC_AUTH}

atlas:
  base-url: ${ATLAS_BASE_URL}
  import-cron: 0 0 3 * * ? # every day at 3

downstream:
  oauth2-token:
    connect-timeout: ${OAUTH2_TOKEN_CONNECT_TIMEOUT:PT5S}
    read-timeout: ${OAUTH2_TOKEN_READ_TIMEOUT:PT10S}
  clients:
    gems:
      connect-timeout: ${GEMS_CONNECT_TIMEOUT:PT5S}
      read-timeout: ${GEMS_READ_TIMEOUT:PT10S}
      retry:
        max-retries: ${GEMS_MAX_RETRIES:2}
        delay: ${GEMS_RETRY_DELAY:PT0.5S}
        multiplier: ${GEMS_RETRY_MULTIPLIER:2}
        read-timeout-retried: ${GEMS_RETRY_READ_TIMEOUT:false}
    orca:
      connect-timeout: ${ORCA_CONNECT_TIMEOUT:PT5S}
      read-timeout: ${ORCA_READ_TIMEOUT:PT10S}
      retry:
        max-retries: ${ORCA_MAX_RETRIES:2}
        delay: ${ORCA_RETRY_DELAY:PT0.5S}
        multiplier: ${ORCA_RETRY_MULTIPLIER:2}
        read-timeout-retried: ${ORCA_RETRY_READ_TIMEOUT:false}
    # per page of the nightly location import
    atlas:
      connect-timeout: ${ATLAS_CONNECT_TIMEOUT:PT5S}
      read-timeout: ${ATLAS_READ_TIMEOUT:PT60S}
      retry:
        max-retries: ${ATLAS_MAX_RETRIES:3}
        delay: ${ATLAS_RETRY_DELAY:PT2S}
        multiplier: ${ATLAS_RETRY_MULTIPLIER:2}
        read-timeout-retried: ${ATLAS_RETRY_READ_TIMEOUT:true}
    # only the token call, with the timeouts of downstream.oauth2-token
    sfera:
      retry:
        max-retries: ${SFERA_TOKEN_MAX_RETRIES:2}
        delay: ${SFERA_TOKEN_RETRY_DELAY:PT0.5S}
        multiplier: ${SFERA_TOKEN_RETRY_MULTIPLIER:2}
        read-timeout-retried: ${SFERA_TOKEN_RETRY_READ_TIMEOUT:false}

admin:
  clean-up:
    cron: 0 0 3 * * ? # every day at 3
    older-than-days: 90

user-activity:
  clean-up:
    cron: 0 0 3 * * ? # every day at 3
    older-than-days: 180

tour-systems:
  entries:
    tip:
      label: "TIP"
      url: "tip3://tours"
    caros:
      label: "Caros"
      url: "https://sbbc.ivu-cloud.com/mbweb/pub/ivu/desktop/login"
    railOpt:
      label: "RailOpt"
      url: "https://railoptweb.sob.ch/personnel-reporting-calendar"
    blsIvu:
      label: "BLS IVU"
      url: "https://ivu.pad.core"
    railCube:
      label: "RailCube"
      url: "play.google.com/store/apps/details?id=com.softlogix.railcube.mobile&hl=en"

---
# only in cluster environment
spring:
  config:
    activate:
      on-profile: "!local & !test"
    import: vault://

---
# Structured logging for Splunk on every stage: one ECS JSON object per line (UTC timestamps), MDC entries and key-value pairs as fields.
# The test profile switches the console back to text (application-test.yaml), the local profile keeps the text pattern above.
spring:
  config:
    activate:
      on-profile: "!local"
logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        # service.name comes from spring.application.name, service.version from the jar manifest (Implementation-Version)
        environment: ${STAGE}
    json:
      # ecs.version and process.pid carry no information for us
      exclude: ecs,process.pid
      rename:
        # the Instana agent's MDC key instana.trace.id becomes the Splunk field mdc.instana.trace.id (SBB convention, see ProblemFactory)
        instana: mdc.instana
      stacktrace:
        root: first
        include-common-frames: false
        max-length: 16384
