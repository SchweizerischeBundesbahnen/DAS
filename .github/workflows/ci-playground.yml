name: Continuous Integration Playground Webapp

defaults:
  run:
    working-directory: das_playground

on:
  push:
    paths:
      - 'das_playground/**'
      - '.github/workflows/ci-playground.yml'
      - '.github/actions/node-run/**'
      - '.github/actions/push-image/**'
    branches: [ "main", "renovate/**" ]
  pull_request:
    paths:
      - 'das_playground/**'
      - '.github/workflows/ci-playground.yml'
      - '.github/actions/node-run/**'
      - '.github/actions/push-image/**'
    branches: [ "main" ]


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-run
        with:
          working-directory: das_playground
          scripts: lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/node-run
        with:
          working-directory: das_playground
          scripts: test

  build:
    runs-on: ubuntu-latest
    # On main the image is pushed, so lint and test must pass first
    needs: [lint, test]
    # Serialize main runs so an older run cannot overwrite the main image of a newer one
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build (+ image on main)
        id: build
        uses: ./.github/actions/node-run
        with:
          working-directory: das_playground
          scripts: build:ngssc
          build-image: ${{ github.ref == 'refs/heads/main' }}
          image-name: playground
      - uses: ./.github/actions/push-image
        if: github.ref == 'refs/heads/main'
        with:
          image-ref: ${{ steps.build.outputs.image-ref }}
