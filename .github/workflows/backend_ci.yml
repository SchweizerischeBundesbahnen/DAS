# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Backend Java CI with Maven

defaults:
  run:
    working-directory: das_backend

on:
  push:
    paths:
      - 'das_backend/**'
      - '.github/workflows/backend_ci.yml'
      - '.github/actions/maven-run/**'
      - '.github/actions/push-image/**'
    branches: [ "main", "renovate/**" ]
  pull_request:
    paths:
      - 'das_backend/**'
      - '.github/workflows/backend_ci.yml'
      - '.github/actions/maven-run/**'
      - '.github/actions/push-image/**'
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  test-title-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/krypton'

      - name: Assign integration test traceability IDs and format whitespace
        working-directory: ${{ github.workspace }}
        run: node scripts/test_title_has_id_no_whitespace.mjs backend

      - name: Fail if any integration test is missing a traceability ID
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- das_backend/src/test

  build:
    runs-on: ubuntu-latest
    # Serialize main runs so an older run cannot overwrite the main image of a newer one
    concurrency:
      group: ${{ github.workflow }}-build-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Vault Secrets 🤫
        id: vault-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault-nonprod.sbb.ch:443
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/DSO-BPS/driver-advisory-system/backend/maven KAFKA_SR_URL ;
            kv/data/DSO-BPS/driver-advisory-system/backend/maven KAFKA_SR_API_KEY ;
            kv/data/DSO-BPS/driver-advisory-system/backend/maven KAFKA_SR_API_SECRET ;
            kv/data/DSO-BPS/driver-advisory-system/ci/common SONAR_TOKEN ;

      - name: Maven verify + Sonar (+ image on main)
        id: build
        uses: ./.github/actions/maven-run
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          SONAR_TOKEN: ${{ steps.vault-secrets.outputs.SONAR_TOKEN }}
          KAFKA_SR_URL: ${{ steps.vault-secrets.outputs.KAFKA_SR_URL }}
          KAFKA_SR_API_KEY: ${{ steps.vault-secrets.outputs.KAFKA_SR_API_KEY }}
          KAFKA_SR_API_SECRET: ${{ steps.vault-secrets.outputs.KAFKA_SR_API_SECRET }}
        with:
          working-directory: das_backend
          # Sonar reads the token from the SONAR_TOKEN environment variable
          args: >-
            verify
            org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
            -Dsonar.projectKey=schweizerischebundesbahnen-DAS-Backend
            -Dsonar.organization=schweizerischebundesbahnen
            -Dsonar.projectName=DAS/Backend
            -Dsonar.issue.ignore.multicriteria=e1,e2
            -Dsonar.issue.ignore.multicriteria.e1.ruleKey=java:S1452
            -Dsonar.issue.ignore.multicriteria.e1.resourceKey=**
            -Dsonar.issue.ignore.multicriteria.e2.ruleKey=java:S8694
            -Dsonar.issue.ignore.multicriteria.e2.resourceKey=**
          build-image: ${{ github.ref == 'refs/heads/main' }}
          image-name: backend

      - name: Setup Node.js
        if: always()
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'

      - name: Extract test report
        if: always()
        run: node ../scripts/extract_backend_test_report.mjs target/surefire-reports target/test-report.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-report
          path: das_backend/target/test-report.json

      - uses: ./.github/actions/push-image
        if: github.ref == 'refs/heads/main'
        with:
          image-ref: ${{ steps.build.outputs.image-ref }}
