name: Client Build iOS

defaults:
  run:
    working-directory: das_client

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'das_client/**'
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-26
    steps:

    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ~26.6

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.47.x'
        cache: true

    - name: Setup melos
      uses: bluefireteam/melos-action@2982f8e4fc92440a219490009d6d05195cb1a6a5 # v3.8.0
      with:
        melos-version: '^7.4.0'
        run-bootstrap: 'false'

    - name: Get dependencies
      run: flutter pub get

    - name: Generate sources
      run: melos generate

    - name: Vault Secrets 🤫
      id: vault-secrets
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: https://vault-nonprod.sbb.ch:443
        method: approle
        roleId: ${{ secrets.VAULT_ROLE_ID }}
        secretId: ${{ secrets.VAULT_SECRET_ID }}
        secrets: |
          kv/data/DSO-BPS/driver-advisory-system/ci/mobile SBB_APPSTORE_BASE64 ;
          kv/data/DSO-BPS/driver-advisory-system/ci/mobile SBB_APPSTORE_P12_PASSWORD ;
          kv/data/DSO-BPS/driver-advisory-system/ci/mobile KEYCHAIN_PASSWORD ;
          kv/data/DSO-BPS/driver-advisory-system/ci/mobile APPSTORE_CONNECT_PRIVATE_KEY_BASE64 ;
          kv/data/DSO-BPS/driver-advisory-system/ci/mobile APPSTORE_CONNECT_ISSUER_ID ;
          kv/data/DSO-BPS/driver-advisory-system/ci/mobile APPSTORE_CONNECT_KEY_ID ;
          kv/data/DSO-BPS/driver-advisory-system/ci/mobile APPSTORE_CONNECT_PRIVATE_KEY ;

    - name: Install Apple signing certificate and appstore connect key
      env:
        SBB_APPSTORE_BASE64: ${{ steps.vault-secrets.outputs.SBB_APPSTORE_BASE64 }}
        SBB_APPSTORE_P12_PASSWORD: ${{ steps.vault-secrets.outputs.SBB_APPSTORE_P12_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ steps.vault-secrets.outputs.KEYCHAIN_PASSWORD }}
        APPSTORE_CONNECT_PRIVATE_KEY_BASE64: ${{ steps.vault-secrets.outputs.APPSTORE_CONNECT_PRIVATE_KEY_BASE64 }}
      run: |
        # create variables
        SBB_CERTIFICATE_PATH=$RUNNER_TEMP/sbb_appstore.p12
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        APPSTORE_CONNECT_PRIVATE_KEY_PATH=~/AuthKey.p8

        # import certificate and private key from secrets
        echo -n "$SBB_APPSTORE_BASE64" | base64 --decode -o $SBB_CERTIFICATE_PATH
        echo -n "$APPSTORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode -o $APPSTORE_CONNECT_PRIVATE_KEY_PATH

        # create temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # import certificate to keychain
        security import $SBB_CERTIFICATE_PATH -P "$SBB_APPSTORE_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

    - name: Download Provisioning Profiles
      uses: apple-actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6.1.0
      with:
        bundle-id: 'ch.sbb.das.dev'
        issuer-id: ${{ steps.vault-secrets.outputs.APPSTORE_CONNECT_ISSUER_ID }}
        api-key-id: ${{ steps.vault-secrets.outputs.APPSTORE_CONNECT_KEY_ID }}
        api-private-key: ${{ steps.vault-secrets.outputs.APPSTORE_CONNECT_PRIVATE_KEY }}

    - name: Build iOS App DEV
      run: flutter build ipa --flavor dev -t lib/main_dev.dart --release
      working-directory: das_client/app

    - name: Download Provisioning Profiles
      uses: apple-actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6.1.0
      with:
        bundle-id: 'ch.sbb.das.inte'
        issuer-id: ${{ steps.vault-secrets.outputs.APPSTORE_CONNECT_ISSUER_ID }}
        api-key-id: ${{ steps.vault-secrets.outputs.APPSTORE_CONNECT_KEY_ID }}
        api-private-key: ${{ steps.vault-secrets.outputs.APPSTORE_CONNECT_PRIVATE_KEY }}

    - name: Build iOS App INTE
      run: flutter build ipa --flavor inte -t lib/main_inte.dart --release
      working-directory: das_client/app

    - name: Download Provisioning Profiles
      uses: apple-actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6.1.0
      with:
        bundle-id: 'ch.sbb.das'
        issuer-id: ${{ steps.vault-secrets.outputs.APPSTORE_CONNECT_ISSUER_ID }}
        api-key-id: ${{ steps.vault-secrets.outputs.APPSTORE_CONNECT_KEY_ID }}
        api-private-key: ${{ steps.vault-secrets.outputs.APPSTORE_CONNECT_PRIVATE_KEY }}

    - name: Build iOS App PROD
      run: flutter build ipa --flavor prod -t lib/main_prod.dart --release
      working-directory: das_client/app
