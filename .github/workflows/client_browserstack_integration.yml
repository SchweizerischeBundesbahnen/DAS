name: Client Browserstack Integration

on:
  schedule:
    - cron: '21 2 * * *'
  pull_request:
    paths:
      - 'das_client/**'
      - '.github/workflows/client_browserstack_integration.yml'
      - '.github/workflows/client_browserstack_base.yml'
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run:
    uses: ./.github/workflows/client_browserstack_base.yml
    with:
      entrypoint: integration_test/app_test.dart
    secrets: inherit
