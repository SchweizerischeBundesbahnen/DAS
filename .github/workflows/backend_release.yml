# Called by release-please whenever a new release of this module is created.
# This builds the backend container image and pushes it with the release version and as latest.

name: Backend Release

on:
  workflow_call:
    inputs:
      tag-name:
        description: 'Release tag to build, e.g. "backend-v1.2.3"'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag-name:
        description: 'Release tag to build, e.g. "backend-v1.2.3"'
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-das-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag-name }}

      - name: Derive version from tag
        id: version
        env:
          TAG_NAME: ${{ inputs.tag-name }}
        run: |
          # Release tags have the form <component>-v<version>, e.g. backend-v1.2.3
          if [[ "$TAG_NAME" != *-v* ]]; then
            echo "::error::Tag '$TAG_NAME' does not match <component>-v<version>"
            exit 1
          fi
          echo "version=${TAG_NAME##*-v}" >> "$GITHUB_OUTPUT"

      - name: Vault Secrets 🤫
        id: vault-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault-nonprod.sbb.ch:443
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/DSO-BPS/driver-advisory-system/backend/maven KAFKA_SR_URL ;
            kv/data/DSO-BPS/driver-advisory-system/backend/maven KAFKA_SR_API_KEY ;
            kv/data/DSO-BPS/driver-advisory-system/backend/maven KAFKA_SR_API_SECRET ;

      - name: Build
        id: build
        uses: ./.github/actions/maven-run
        env:
          KAFKA_SR_URL: ${{ steps.vault-secrets.outputs.KAFKA_SR_URL }}
          KAFKA_SR_API_KEY: ${{ steps.vault-secrets.outputs.KAFKA_SR_API_KEY }}
          KAFKA_SR_API_SECRET: ${{ steps.vault-secrets.outputs.KAFKA_SR_API_SECRET }}
        with:
          working-directory: das_backend
          build-image: true
          image-name: backend
          image-tag: ${{ steps.version.outputs.version }}

      - uses: ./.github/actions/push-image
        with:
          image-ref: ${{ steps.build.outputs.image-ref }}
          latest: 'true'
