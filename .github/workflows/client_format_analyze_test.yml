name: Client Format Analyze Test

defaults:
  run:
    working-directory: das_client

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'das_client/**'
    branches: [ "main" ]
  pull_request:
    paths:
      - 'das_client/**'
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.x'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format check with line length 120
        run: dart format -l 120 -o none --set-exit-if-changed .

      - name: Setup melos
        uses: bluefireteam/melos-action@v3.8.0
        with:
          melos-version: '^7.4.0'
          run-bootstrap: 'false'

      - name: Generate sources
        run: melos generate

      - name: Flutter tests with coverage
        run: melos coverage

  test-title-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 'lts/krypton'

      - name: Assign integration test traceability IDs and format whitespace
        working-directory: ${{ github.workspace }}
        run: node scripts/test_title_has_id_no_whitespace.mjs client

      - name: Fail if any integration test is missing a traceability ID
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- das_client/app/integration_test/test
