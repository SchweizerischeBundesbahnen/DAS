name: Client Format Analyze Test

defaults:
  run:
    working-directory: das_client

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'das_client/**'
    branches: [ "main" ]
  pull_request:
    paths:
      - 'das_client/**'
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Vault Secrets 🤫
        id: vault-secrets
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://vault-nonprod.sbb.ch:443
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          secrets: |
            kv/data/DSO-BPS/driver-advisory-system/ci/common SONAR_TOKEN ;

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.x'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format check with line length 120
        run: dart format -l 120 -o none --set-exit-if-changed .

      - name: Setup melos
        uses: bluefireteam/melos-action@b79b63bcd183f823740a7976cbdb4b0fc95a0eb8 # v3.10.0
        with:
          melos-version: '^7.4.0'
          run-bootstrap: 'false'

      - name: Generate sources
        run: melos generate

      - name: Flutter tests with coverage
        run: melos coverage

      - name: Sonar scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ steps.vault-secrets.outputs.SONAR_TOKEN }}
        with:
          projectBaseDir: das_client
          args: >
            -Dsonar.organization=schweizerischebundesbahnen
            -Dsonar.projectKey=schweizerischebundesbahnen_DAS-Client
            -Dsonar.projectName=DAS/Client
            -Dsonar.sources=app/lib,app_links_x/lib,auth/lib,formation/lib,local_regulations/lib,logger/lib,preload/lib,sfera/lib,warnapp/lib
            -Dsonar.tests=app/test,app_links_x/test,auth/test,formation/test,local_regulations/test,logger/test,preload/test,sfera/test,warnapp/test
            -Dsonar.inclusions=**/lib/**
            -Dsonar.test.inclusions=**/test/**
            -Dsonar.exclusions=**/*.g.dart,**/.dart_tool/**,**/android/**,**/ios/**
            -Dsonar.flutter.enabled=true
            -Dsonar.language=dart
            -Dsonar.dart.lcov.reportPaths=**/coverage/lcov.info

  test-title-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/krypton'

      - name: Assign integration test traceability IDs and format whitespace
        working-directory: ${{ github.workspace }}
        run: node scripts/test_title_has_id_no_whitespace.mjs client

      - name: Fail if any integration test is missing a traceability ID
        working-directory: ${{ github.workspace }}
        run: git diff --exit-code -- das_client/app/integration_test/test
