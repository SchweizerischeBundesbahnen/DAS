name: Client Build Android

defaults:
  run:
    working-directory: das_client

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - 'das_client/**'
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
      with:
        flutter-version: '3.47.x'
        cache: true

    - name: Setup melos
      uses: bluefireteam/melos-action@b79b63bcd183f823740a7976cbdb4b0fc95a0eb8 # v3.10.0
      with:
        melos-version: '^7.4.0'
        run-bootstrap: 'false'

    - name: Get dependencies
      run: flutter pub get

    - name: Generate sources
      run: melos generate

    - name: Vault Secrets 🤫
      id: vault-secrets
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: https://vault-nonprod.sbb.ch:443
        method: approle
        roleId: ${{ secrets.VAULT_ROLE_ID }}
        secretId: ${{ secrets.VAULT_SECRET_ID }}
        secrets: |
          kv/data/DSO-BPS/driver-advisory-system/ci/mobile ANDROID_KEYSTORE ;
          kv/data/DSO-BPS/driver-advisory-system/ci/mobile ANDROID_KEYSTORE_PASSWORD ;
          kv/data/DSO-BPS/driver-advisory-system/ci/mobile ANDROID_KEY_ALIAS ;
          kv/data/DSO-BPS/driver-advisory-system/ci/mobile ANDROID_KEY_PASSWORD ;

    - name: Prepare Android Secrets
      env:
        ANDROID_KEYSTORE_STRING: ${{ steps.vault-secrets.outputs.ANDROID_KEYSTORE }}
        ANDROID_KEYSTORE: ${{ github.workspace }}/das_client/app/android/das.keystore
        ANDROID_KEYSTORE_PASSWORD: ${{ steps.vault-secrets.outputs.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ steps.vault-secrets.outputs.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ steps.vault-secrets.outputs.ANDROID_KEY_PASSWORD }}
      run: |
        echo $ANDROID_KEYSTORE_STRING | base64 -d > $ANDROID_KEYSTORE
        echo "ANDROID_KEYSTORE=$ANDROID_KEYSTORE" >> "$GITHUB_ENV"
        echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
        echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
        echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

    - name: Build Appbundle DEV
      run: flutter build appbundle --flavor dev -t lib/main_dev.dart
      working-directory: das_client/app

    - name: Build Appbundle INTE
      run: flutter build appbundle --flavor inte -t lib/main_inte.dart
      working-directory: das_client/app

    - name: Build Appbundle PROD
      run: flutter build appbundle --flavor prod -t lib/main_prod.dart
      working-directory: das_client/app
