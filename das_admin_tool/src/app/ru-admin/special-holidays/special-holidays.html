@if (specialHolidays.hasValue() && specialHolidays.value().data.length > 0) {
  <app-special-holidays-table [title]="title" />
} @else {
  <app-page-header
    [showAdd]="specialHolidays.hasValue()"
    [title]="title"
    (addClicked)="specialHolidayService.add()"
  />
  @if (specialHolidays.hasValue()) {
    <p i18n="@@special_holidays_empty_state">Noch keine speziellen Feiertage erfasst.</p>
  } @else if (specialHolidays.error()) {
    <p i18n="@@special_holidays_error_loading">Fehler beim Laden der Feiertage</p>
  } @else if (specialHolidays.isLoading()) {
    <sbb-loading-indicator-circle />
  }
}
