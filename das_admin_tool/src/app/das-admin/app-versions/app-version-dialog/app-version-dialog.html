<app-base-dialog
  i18n-stepLabel="@@app_version_dialog_step_label"
  stepLabel="App Version"
  [data]="dialogData"
  [dialogClose]="formValue"
  [dialogTitle]="dialogTitle"
  [saveDisabled]="versionForm().invalid()"
>
  <form class="form">
    <sbb-form-field errorSpace="reserve">
      <label for="version" i18n="@@app_versions_form_version_label">App Version</label>
      <input placeholder="0.0.0" [formField]="versionForm.version" />
      @if (versionForm.version().touched()) {
        @for (error of versionForm.version().errors(); track error.kind) {
          <sbb-error>{{ error.message }}</sbb-error>
        }
      }
    </sbb-form-field>
    <div class="minimalVersion">
      <sbb-toggle-check
        i18n="@@app_versions_form_minimal_version_label"
        [formField]="versionForm.minimalVersion"
        >Minimale Version</sbb-toggle-check
      >
      <sbb-mini-button iconName="circle-information-small" id="popover-trigger" />
      <sbb-popover hoverTrigger="true" trigger="popover-trigger">
        <sbb-title i18n="@@app_versions_form_minimal_version_title" level="2" visualLevel="6"
          >Minimale Version</sbb-title
        >
        <p class="sbb-text-s" i18n="@@app_versions_form_minimal_version_hint"
          >Damit werden alle tieferen Versionen blockiert!</p
        >
      </sbb-popover>
    </div>
    <sbb-form-field>
      <label for="expiryDate" i18n="@@app_versions_form_expiry_date_label"
        >Gültig ab (optional)</label
      >
      <sbb-datepicker-previous-day />
      <sbb-date-input [formField]="versionForm.expiryDate" [min]="minDate" />
      <sbb-datepicker />
      <sbb-datepicker-toggle />
      <sbb-datepicker-next-day />
    </sbb-form-field>
  </form>
</app-base-dialog>
